name: Deploy install page to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 第三方套件（terser、jsdom 等）只在沒有部署權限的 job 裡執行
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # terser 是 devDependency；CI 中 build.js 沒有 terser 會直接中止，不上傳保守壓縮版
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Test and build bookmarklet and install page
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
