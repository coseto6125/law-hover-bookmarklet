name: Deploy install page to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 第三方套件（terser、jsdom 等）只在沒有部署權限的 job 裡執行
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # terser 是 devDependency；CI 中 build.js 沒有 terser 會直接中止，不上傳保守壓縮版
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Test and build bookmarklet and install page
        run: npm test
      # 瀏覽器測試（安裝頁引導動畫、跨平台觸控）。不放進部署 job，維持 build job 無部署權限。
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test install page in a real browser
        run: npm run test:guide
      # ONLINE=0 只跑離線案例並以其成績退出：GitHub runner 不一定連得到 law.moj.gov.tw
      - name: Test touch and platform behavior (offline cases)
        run: npm run test:mobile
        env:
          ONLINE: '0'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
